<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body { min-width: 320px; }
      body {
        width: 320px;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #0f172a;
        background: #fff;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
      }
      .logo {
        width: 26px; height: 26px; border-radius: 7px;
        background: var(--brand); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 14px;
      }
      .title { font-weight: 700; font-size: 15px; }
      .title span { color: var(--brand); }
      .body { padding: 16px; }
      label { font-size: 12px; color: #64748b; }
      .url {
        margin-top: 4px; font-size: 11px; color: #334155;
        word-break: break-all; max-height: 48px; overflow: hidden;
        background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 8px;
        padding: 8px 10px;
      }
      input {
        width: 100%; margin-top: 6px; padding: 9px 10px;
        border: 1px solid #e2e8f0; border-radius: 9px; font-size: 12px;
        outline: none;
      }
      input:focus { border-color: var(--brand); }
      button {
        width: 100%; margin-top: 14px; padding: 11px;
        background: var(--brand); color: #fff; border: 0;
        border-radius: 999px; font-weight: 600; font-size: 13px; cursor: pointer;
      }
      button:hover { background: var(--brand-dark); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .hint { margin-top: 10px; font-size: 11px; color: #94a3b8; text-align: center; }
      .settings { margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
      .msg {
        display: none; margin-top: 10px; font-size: 11px;
        border-radius: 8px; padding: 8px 10px;
      }
      .msg.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
      .msg.warn  { display: block; background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="logo">V</div>
      <div class="title">Vids<span>Save</span></div>
    </div>
    <div class="body">
      <label>Current tab</label>
      <div class="url" id="current-url">Reading current tab…</div>

      <button id="download" disabled>Download this video</button>
      <p class="hint">Opens VidsSave and analyzes the link automatically.</p>

      <div id="message" class="msg"></div>

      <div class="settings">
        <label for="site">VidsSave site URL</label>
        <input id="site" type="text" placeholder="http://localhost:3000" />
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
